{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Prototyp</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class = "navigation_bar_top">
        <button id="menuButton" class="menu_button">☰ Nach Login sichtbar</button>
        <div id="menu" class="dropdown_menu">
            <a href="{% url 'themenkomplex1' %}" class="menu_link">Themenkomplex 1</a>
            <a href="{% url 'themenkomplex2' %}" class="menu_link">Themenkomplex 2</a>
            <a href="{% url 'themenkomplex3' %}" class="menu_link">Themenkomplex 3</a>
            <a href="{% url 'themenkomplex1' %}" class="menu_link">Themenkomplex 4</a>
            <a href="{% url 'themenkomplex1' %}" class="menu_link">Themenkomplex 5</a>
            <a href="{% url 'themenkomplex1' %}" class="menu_link">Themenkomplex 6</a>
            <a href="{% url 'themenkomplex1' %}" class="menu_link">Themenkomplex 7</a>
            <a href="{% url 'themenkomplex1' %}" class="menu_link">Themenkomplex 8</a>
            <a href="{% url 'themenkomplex1' %}" class="menu_link">Themenkomplex 9</a>
        </div>
        <div class = "topbar_text">
            <a class = "menulink" href="{% url 'index' %}">Home</a>
            <a class = "menulink" href="{% url 'buchungsaufgabe' %}">Buchungsaufgabe</a>
            <a class = "menulink" href="{% url 'login' %}">Login</a>
            <a class = "menulink" href="{% url 'vorlage' %}">Vorlage</a>
        </div>
    </div>
    <div id="loginContainer" class="login_container">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="username">Benutzername:</label>
            <input type="text" id="username" name="username" required><br><br>
            <label for="password">Passwort:</label>
            <input type="password" id="password" name="password" required><br><br>
            <button type="submit">Einloggen</button>
        </form>
    </div>
    <div id="logoutContainer">
        <button id="logoutButton">Ausloggen</button>
    </div>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
