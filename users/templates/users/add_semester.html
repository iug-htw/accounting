{% extends 'master_layout.html' %}

{% block content %}
<h1>Semester verwalten</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Semester hinzufügen</button>
</form>

<h2>Vorhandene Semester</h2>
<ul>
    {% for sem in semester %}
        <li>
            {{ sem.name }}
            <a href="{% url 'users:delete_semester' sem.id %}" 
               onclick="return confirm('Sind Sie sicher, dass Sie dieses Semester löschen möchten?')">Löschen</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
