{% extends 'master_layout.html' %}

{% block content %}
<h1>Mehrere Studierende gleichzeitig anlegen</h1>

<form method="post">
    {% csrf_token %}

    <label for="anzahl">Anzahl der Studierenden:</label>
    <input type="range" id="anzahl" name="anzahl_studierende" min="1" max="50" value="1" oninput="anzahlOutput.value = anzahl.value">
    <output id="anzahlOutput">1</output>

    <label for="studiengang">Studiengang:</label>
    <select name="studiengang" required>
        {% for sg in studiengaenge %}
            <option value="{{ sg.name }}">{{ sg.name }}</option>
        {% endfor %}
    </select>

    <label for="semester">Semester:</label>
    <select name="semester" required>
        {% for sem in semester %}
            <option value="{{ sem.name }}">{{ sem.name }}</option>
        {% endfor %}
    </select>

    <!-- Umschalter für Namensvergabe -->
    <label for="name_mode">Namensmodus:</label>
    <input type="checkbox" id="name_mode" name="name_mode" onchange="toggleNameInput()">
    <span id="name_mode_label">Automatischer Name</span>

    <!-- Eingabefeld für individuellen Namen (Standardmäßig versteckt) -->
    <div id="custom_name_field" style="display: none;">
        <label for="custom_name">Individueller Name:</label>
        <input type="text" id="custom_name" name="custom_name">
    </div>

    <button type="submit" class="btn btn-primary">Studierende anlegen</button>
</form>

<script>
    function toggleNameInput() {
        let nameMode = document.getElementById("name_mode");
        let nameLabel = document.getElementById("name_mode_label");
        let customNameField = document.getElementById("custom_name_field");

        if (nameMode.checked) {
            nameLabel.innerText = "Individueller Name";
            customNameField.style.display = "block";
        } else {
            nameLabel.innerText = "Automatischer Name";
            customNameField.style.display = "none";
        }
    }
</script>
{% endblock %}
