{%extends 'vorlage.html' %}
{%block title%}
    Post List
{% endblock%}
    {{post.title}}
{%block content%}
<body>
    <section>
        <h1>Posts List</h1>
        {% for post in posts%}
            <article class = "post">
                <h2>    
                    <a href="{% url 'posts:page' slug=post.slug%}">
                    {{post.title}}
                    </a>
                </h2>
                <p>{{post.date}} by {{post.author}}</p>
                <p>{{post.body}}</p>
            </article>
        {% endfor %}
    </section>
{% endblock%}
