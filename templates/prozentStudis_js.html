<script>
const gettexts = {
        sem: "{{ _('Alle Semester') }}",
        stud: "{{ _('Alle Studiengänge') }}",
        aufgabe: "{{ _('Alle Aufgaben') }}",
        studis: "{{ _('Bitte Studierenden wählen') }}",
        wahl: "{{ _('Bitte wählen') }}"
    };
function befuellenDropdown(elementId, daten, wertKey, textKey) {
    let dropdown = document.getElementById(elementId);
    if (!dropdown) return;
    let defaultOptionText = {
        'filter-semester': `${gettexts.sem}`,
        'filter-studiengang': `${gettexts.stud}`,
        'filter-aufgabe': `${gettexts.aufgabe}`,
        'filter-student': `${gettexts.studis}`
    };
    dropdown.innerHTML = `<option value="">${defaultOptionText[elementId] ||  `${gettexts.wahl}`}</option>`;

    if (daten) {
        daten.forEach(item => {
            let option = document.createElement('option');
            option.value = item[wertKey];
            option.textContent = item[textKey];
            dropdown.appendChild(option);
        });
    }
}

// 📌 Funktion zum Verarbeiten der Lehrer-Filter-Daten für die Dropdowns
function verarbeiteLehrerFilter(data) {
    befuellenDropdown('filter-semester', data.semesters, 'semester_id', 'semester__name');
    befuellenDropdown('filter-studiengang', data.studiengaenge, 'studiengang_id', 'studiengang__name');
    befuellenDropdown('filter-aufgabe', data.aufgaben, 'id', 'fragentyp_text');
}

// 📌 Funktion zum Verarbeiten der Studierendenliste für die Lehrer-Ansicht
function verarbeiteStudiListe(data) {
    befuellenDropdown('filter-student', data.studierende, 'id', 'name');
}

// 📌 Funktion zum Laden von API-Daten
function ladeDaten(url, callback) {
    fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error(`Fehler beim Abruf von ${url}: ${response.status}`);
            }
            return response.json();
        })
        .then(data => callback(data))
        .catch(error => console.error(`Fehler beim Laden von ${url}:`, error));
}

// 📌 DOMContentLoaded: Lädt die Filterdaten für Lehrer
document.addEventListener("DOMContentLoaded", function() {
    ladeDaten("/posts/lehrer_filter_daten/", function(data) {
        verarbeiteLehrerFilter(data);
        verarbeiteStudiListe(data);

        if ("{{ user.role }}" === "teacher") {
            ladeLehrerFortschritt(); // ✅ Fortschritt direkt anzeigen
        }
    });

    if ("{{ user.role }}" === "student") {
        ladeStudentenFortschritt();
    }
});
document.getElementById('filter-semester').addEventListener('change', function() {
    const semester = this.value;
    const studiengang = document.getElementById('filter-studiengang').value;
    aktualisiereStudiDropdownNachFilter(semester, studiengang);
});

document.getElementById('filter-studiengang').addEventListener('change', function() {
    const studiengang = this.value;
    const semester = document.getElementById('filter-semester').value;
    aktualisiereStudiDropdownNachFilter(semester, studiengang);
});
// 📌 **Fix: Fortschritt für Studierende abrufen und Balken updaten**
function ladeStudentenFortschritt() {
    fetch("/posts/nutzer_fortschritt/")
        .then(response => {
            if (!response.ok) throw new Error("Fehler beim Abruf der Daten.");
            return response.json();
        })
        .then(data => {
            console.log("Studenten-Fortschritt geladen:", data);

            let gesamt = data.gesamt || 1; // Falls keine Daten vorhanden, setze 1, um Division durch 0 zu vermeiden
            let korrektProzent = berechneProzent(data.korrekt, gesamt);
            let bearbeitetProzent = berechneProzent(data.bearbeitet, gesamt);

            // 🚀 **Hier werden jetzt die Balken aktualisiert, nicht mehr SVGs!**
            aktualisiereBalken("progress-bearbeitet", bearbeitetProzent);
            aktualisiereBalken("progress-korrekt", korrektProzent);
        })
        .catch(error => console.error("Fehler beim Laden des Studentenfortschritts:", error));
}

// 📌 **Fix: Fortschritt für Lehrer abrufen und Balken updaten**
function ladeLehrerFortschritt() {
    let semester = document.getElementById('filter-semester').value;
    let studiengang = document.getElementById('filter-studiengang').value;
    let aufgabe = document.getElementById('filter-aufgabe').value;

    let url = `/posts/lehrer_fortschritt/?semester=${semester}&studiengang=${studiengang}&aufgabe=${aufgabe}`;
    ladeFortschritt(url, "progress-lehrer-korrekt", "progress-lehrer-bearbeitet");
    aktualisiereStudiDropdownNachFilter(semester, studiengang);
}

// 📌 **Fix: Fortschritt für einen bestimmten Studierenden abrufen**
function ladeStudiFortschritt() {
    let studentId = document.getElementById('filter-student').value;
    if (!studentId) {
        console.warn("Kein Studierender ausgewählt.");
        return;
    }

    let url = `/posts/lehrer_studi_fortschritt/${studentId}/`;
    console.log("Rufe API auf:", url);

    ladeFortschritt(url, "progress-studi-korrekt", "progress-studi-bearbeitet");
}
function aktualisiereStudiDropdownNachFilter(semester, studiengang) {
    const url = `/posts/lehrer_filter_daten/?semester=${semester}&studiengang=${studiengang}`;
    ladeDaten(url, function(data) {
        verarbeiteStudiListe(data);  // befüllt #filter-student
    });
}

// 📌 **Fix: Fortschritt für Lehrer oder Studierende (NUR Balken, keine SVGs mehr!)**
function ladeFortschritt(url, korrektId, bearbeitetId) {
    fetch(url)
        .then(response => {
            if (!response.ok) throw new Error(`Fehler beim Abruf: ${response.status}`);
            return response.json();
        })
        .then(data => {
            console.log("Fortschritts-Daten geladen:", data);

            let gesamt = data.gesamt_aufgaben || 1;
            let korrektProzent = berechneProzent(data.korrekt, gesamt);
            let bearbeitetProzent = berechneProzent(data.bearbeitet, gesamt);

            // 🚀 **Jetzt werden die Balken aktualisiert, keine SVG-Kreise mehr!**
            aktualisiereBalken(korrektId, korrektProzent);
            aktualisiereBalken(bearbeitetId, bearbeitetProzent);

            if (korrektId === "progress-lehrer-korrekt") {
                // Nur bei der Lehreransicht anzeigen
                if (data.anzahl_fehlerhafte_buchungen !== undefined) {
                    document.getElementById("anzahl-fehlerhaft").textContent = data.anzahl_fehlerhafte_buchungen;
                }
                if (data.anzahl_studierende !== undefined) {
                    document.getElementById("anzahl-bearbeiter").textContent = data.anzahl_studierende;
                }
            }
        })
        
        .catch(error => console.error(`Fehler beim Laden des Fortschritts:`, error));
}

// **🚀 Neue Methode zum Aktualisieren der Fortschrittsbalken**
function aktualisiereBalken(elementId, prozent) {
    let balken = document.getElementById(elementId);
    if (balken) {
        let sichtbareBreite = prozent > 0 ? prozent + "%" : "15px"; // Falls 0%, dann min. 15px
        balken.style.width = sichtbareBreite;
        balken.textContent = prozent + "%";
    }
}

// Berechnet den Prozentwert für die Fortschrittsbalken
function berechneProzent(teil, gesamt) {
    return gesamt > 0 ? Math.round((teil / gesamt) * 100) : 0;
}
</script>
