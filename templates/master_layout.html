{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureNet Homepage</title> 
    <link rel="stylesheet" href="{% static 'css/master_layout.css' %}">
    {% block css %}
    {% endblock %}
</head>
<body>
    <!-- Page Container -->
    <div class="page-container">
        <!-- Header Section -->
        <header class="header-container">
            <!-- Logo Section -->
            <div class="logo-container">
                <img src="/media/securenet-logo.png"
                     alt="SecureNet Logo"
                     class="securenet-logo">
                <span class="logo-text">SecureNet</span>
            </div>
            <!-- Navigation Bar -->
            <nav class="navigation-bar">
                <div class="nav-element">
                    <img src="/media/notification-alert-svgrepo-com.png"
                         alt="Notifications"
                         class="nav-icon">
                    <span>Posteingang</span>
                </div>
                    <a href="{% url 'posts:posteingang' %}" class="nav-element">Posteingang</a>
                    <a href="#" class="nav-element">Finanzverwaltung</a>
                    <a href="{% url 'posts:rechnung' %}" class="nav-element">Rechnungen</a>
                    <a href="{% url 'frontpage' %}" class="nav-element">Home</a>
                    <a href="{% url 'posts:aufgabe_erstellen' %}" class="nav-element">Aufgabe erstellen</a>
                    {% if user.is_authenticated %}
                    <form class="logout" action="{%url 'users:logout' %}" method = "post">
                        {% csrf_token %}
                        <button class="logout-button" title="User Logout">Logout</button>
                        <a class = "nav-element" href="{% url 'users:register' %}">Nutzer anlegen</a>
                    </form>
                    {% else %}
                        <a class = "nav-element" href="{% url 'users:login' %}">Login</a>
                    {% endif %}
            </nav>
        </header>
    </div>
    
    <div class="content-container">
        {% block content %}
        <!-- Hier wird der spezifische Seiteninhalt platziert -->
        {% endblock %}
    </div>
</body>
</html>
