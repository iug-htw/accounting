<script>
window.addEventListener('DOMContentLoaded', (event) => {
        const submitButton = document.getElementById('btn-submit');
        const isBlocked = "{{ block_buchung }}" === "True";
    
        if (isBlocked) {
            submitButton.disabled = true;
            let warnung = document.createElement('p');
            warnung.style.color = 'red';
            warnung.textContent = "{{ _('Die letzte Buchung muss korrigiert werden, bevor neue Buchungen möglich sind. Gehe dafür auf Buchungen anzeigen/verstecken.') }}";
            submitButton.parentElement.insertBefore(warnung, submitButton);
        }
});

const showText = "{{ _('📥 Buchungs-Navigation einblenden') }}";
const hideText = "{{ _('📄 Buchungs-Navigation ausblenden') }}";

document.addEventListener("DOMContentLoaded", function () {
    // Zustand der Buchungsansicht wiederherstellen
    const buchungenAnsicht = document.getElementById("buchungen-ansicht");
    if (localStorage.getItem("buchungenOffen") === "true") {
        buchungenAnsicht.style.display = "none";
        localStorage.setItem("buchungenOffen", "false");
    }

    document.getElementById("toggle-buchung-ansicht").addEventListener("click", function () {
        let istSichtbar = buchungenAnsicht.style.display === "block";
        //buchungenAnsicht.style.display = istSichtbar ? "none" : "block";
        localStorage.setItem("buchungenOffen", istSichtbar ? "false" : "true");
    });

    // === 3. Rechte Seite ein-/ausblenden ===
    const toggleRightBtn = document.getElementById("toggle-right-section");
    const rightSection = document.querySelector(".right-section_rechnung");
    const contentWrapper = document.querySelector(".content-wrapper_rechnung");

    if (localStorage.getItem("rightSectionHidden") === "true") {
        rightSection.classList.add("right-section-hidden");
        contentWrapper.classList.add("hide-right");
        toggleRightBtn.textContent = showText;
    }

    toggleRightBtn.addEventListener("click", () => {
        rightSection.classList.toggle("right-section-hidden");
        contentWrapper.classList.toggle("hide-right");

        const isNowHidden = rightSection.classList.contains("right-section-hidden");
        localStorage.setItem("rightSectionHidden", isNowHidden.toString());

        toggleRightBtn.textContent = isNowHidden
            ? showText
            : hideText;
    });

    // === 4. Scrollposition & Ansicht beim Submit speichern ===
    document.getElementById("absenden").addEventListener("submit", function () {
        localStorage.setItem("scrollPosition", window.scrollY);
        localStorage.setItem("buchungenOffen", buchungenAnsicht.style.display === "block" ? "true" : "false");
    });

    // === 5. Scrollposition wiederherstellen ===
    if (localStorage.getItem("scrollPosition")) {
        window.scrollTo(0, 0);
    }
});

function addField(containerId) {
    let container = document.getElementById(containerId);
    let kontenOptions = `
        <option value="">"{{ _('Bitte wählen...') }}"</option>
        {% for konto in konten %}
            {% if konto.kontenplan_id == kontenplan_id %}
                {% with konto.kontonummer|stringformat:"04d" as nummer %}
                    <option value="{{ konto.id }}">
                        {% if konto.kontonummer %}{{ nummer }} {% endif %}{{ konto.name }}
                    </option>
                {% endwith %}
            {% endif %}
        {% endfor %}
    `;
    let newFieldGroup = document.createElement('div');
    newFieldGroup.classList.add('input-group_rechnung');
    newFieldGroup.innerHTML = `
        <select name="${containerId.includes('soll') ? 'soll_konto[]' : 'haben_konto[]'}" onchange="kontoOderBetragGeaendert(this)" required>
            ${kontenOptions}
        </select>
        <input type="number" step="0.01" oninput="kontoOderBetragGeaendert(this)" placeholder="{{ _('Betrag eingeben')}}" name="${containerId.includes('soll') ? 'soll_betrag[]' : 'haben_betrag[]'}" required>
        <button type="button" class="btn-remove_rechnung" onclick="removeField(this)"></button>
    `;

    container.appendChild(newFieldGroup);
    $(newFieldGroup).find('select').select2({
        width: 'resolve',
        placeholder: "{{ _('Bitte wählen...') }}",
        allowClear: true
    });
}

function removeField(button) {
    button.parentElement.remove();
}

function showBuchung(buchungId) {
    const buchungDetail = document.getElementById(`buchung-${buchungId}`);
    const isVisible = buchungDetail.style.display === 'block';
    buchungDetail.style.display = isVisible ? 'none' : 'block';
}
document.getElementById('toggle-buchung-ansicht').addEventListener('click', function () {
    const buchungenAnsicht = document.getElementById('buchungen-ansicht');
    buchungenAnsicht.style.display = buchungenAnsicht.style.display === 'none' ? 'block' : 'none';
});

// Details der einzelnen Buchungen anzeigen
function showBuchungDetail(buchungId) {
    const buchungDetail = document.getElementById(`buchung-detail-${buchungId}`);
    buchungDetail.style.display = buchungDetail.style.display === 'none' ? 'block' : 'none';
}

let aktuelleBuchungId = null;

function showKorrekturbuchungMaske(buchungId) {
    aktuelleBuchungId = buchungId;
    document.getElementById('korrekturbuchung-maske').style.display = 'block';
}

function durchfuehrenKorrekturbuchung() {
    if (aktuelleBuchungId) {
        fetch(`/posts/korrekturbuchung_durchfuehren/${aktuelleBuchungId}/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
            }
        })
        .then(() => {
            // Popup sofort schließen
            document.getElementById('korrekturbuchung-maske').style.display = 'none';

            // Seite sofort neu laden
            window.location.reload();
        })
        .catch(error => {
            alert(gettext('Fehler bei der Durchführung der Korrekturbuchung.'));
            console.error(gettext('Fehler:'), error);
        });
    }
}

function fillKorrekturbuchung(sollKonten, habenKonten, betraegeSoll, betraegeHaben) {
        sollKonten = JSON.parse(sollKonten);
        habenKonten = JSON.parse(habenKonten);
        betraegeSoll = JSON.parse(betraegeSoll);
        betraegeHaben = JSON.parse(betraegeHaben);

        const idToName = {
            {% for id, name in konten_namen.items %}
                "{{ id }}": "{{ name }}",
            {% endfor %}
        };

        const sollContainer = document.getElementById('soll-container_rechnung');
        const habenContainer = document.getElementById('haben-container_rechnung');
        const heading = document.getElementById('h2');
    
        // Bestehende Eingabefelder leeren
        sollContainer.innerHTML = '';
        habenContainer.innerHTML = '';
    
        // Korrekturbuchung: Soll und Haben vertauschen (nicht bearbeitbar)
        const korrekturSollContainer = document.createElement('div');
        const korrekturHabenContainer = document.createElement('div');
    
        korrekturSollContainer.innerHTML = '';
        korrekturHabenContainer.innerHTML = '';
    
        for (let i = 0; i < habenKonten.length; i++) {
            korrekturSollContainer.innerHTML += `
                <div class = "input-group_rechnung">
                    <label>${gettext('Soll-Konto')}:</label>
                    <input type="text" value="${idToName[habenKonten[i]] || habenKonten[i]}" readonly>
                    <label>${gettext('Betrag:')}:</label>
                    <input type="number" step="0.01" value="${betraegeHaben[i]}" readonly>
                </div>
            `;
        }
    
        for (let i = 0; i < sollKonten.length; i++) {
            korrekturHabenContainer.innerHTML += `
                <div class = "input-group_rechnung">
                    <label>${gettext('Haben-Konto')}:</label>
                    <input type="text" value="${idToName[sollKonten[i]] || sollKonten[i]}" readonly>
                    <label>${gettext('Betrag:')}:</label>
                    <input type="number"  step="0.01" value="${betraegeSoll[i]}" readonly>
                </div>
            `;
        }
    
        sollContainer.appendChild(korrekturSollContainer);
        habenContainer.appendChild(korrekturHabenContainer);
        if (!document.getElementById('korrektur-hinweis')) {
            const headingNeu = document.createElement('div');
            headingNeu.id = 'korrektur-hinweis';
            headingNeu.innerHTML = `<h5>${gettext('Konten und Werte werden vertauscht, um die letzte Buchung zu korrigieren')}</h5>`;
            heading.appendChild(headingNeu);
        }
    }

// Summenprüfung und Bestätigung vor dem Absenden
function summenCheck(event) {
    event.preventDefault(); // Verhindert sofortiges Absenden

    const submitButton = document.getElementById('btn-submit');
    const form = document.getElementById('absenden'); // Annahme: Ein einzelnes Formular existiert

    // Sammle alle Soll-Beträge
    let sollBetraege = Array.from(document.querySelectorAll('input[name="soll_betrag[]"]'))
        .map(input => parseFloat(input.value.replace(',', '.')) || 0);

    // Sammle Haben-Beträge
    let habenBetraege = Array.from(document.querySelectorAll('input[name="haben_betrag[]"]'))
        .map(input => parseFloat(input.value.replace(',', '.')) || 0);

    // Summen berechnen
    let summeSoll = sollBetraege.reduce((acc, val) => acc + val, 0).toFixed(2);
    let summeHaben = habenBetraege.reduce((acc, val) => acc + val, 0).toFixed(2);

    // Alte Warnung entfernen
    let alteWarnung = document.getElementById('summenwarnung');
    if (alteWarnung) alteWarnung.remove();

    // Überprüfung auf null-Werte
    if (sollBetraege.includes(0) || habenBetraege.includes(0)) {
        let warnung = document.createElement('p');
        warnung.id = 'summenwarnung';
        warnung.style.color = 'red';
        warnung.textContent = "{{ _('⚠️ Beträge dürfen nicht 0 sein!')}}";
        submitButton.after(warnung);
        return;
    }

    // Überprüfung der Summen
    if (summeSoll !== summeHaben) {
        let warnung = document.createElement('p');
        warnung.id = 'summenwarnung';
        warnung.style.color = 'red';
        warnung.textContent = "{{ _('⚠️ Die Summe der Soll-Beträge muss der Summe der Haben-Beträge entsprechen!')}}";
        submitButton.after(warnung);
    } else {
        // Formular korrekt absenden
        form.requestSubmit(); // Verwendet den CSRF-Token korrekt
    }
}

function kontoOderBetragGeaendert() {
    const sollKontoSelects = document.querySelectorAll('select[name="soll_konto[]"]');
    const sollBetragInputs = document.querySelectorAll('input[name="soll_betrag[]"]');
    const habenKontoSelects = document.querySelectorAll('select[name="haben_konto[]"]');
    const habenBetragInputs = document.querySelectorAll('input[name="haben_betrag[]"]');

    const sollKonten = [];
    const sollBetraege = [];
    const habenKonten = [];
    const habenBetraege = [];

    sollKontoSelects.forEach((select, index) => {
        if (select.value && sollBetragInputs[index].value) {
            sollKonten.push(select.value);
            sollBetraege.push(sollBetragInputs[index].value);
        }
    });

    habenKontoSelects.forEach((select, index) => {
        if (select.value && habenBetragInputs[index].value) {
            habenKonten.push(select.value);
            habenBetraege.push(habenBetragInputs[index].value);
        }
    });

    if (sollKonten.length > 0 || habenKonten.length > 0) {
        fetchLiveTKonto(sollKonten, sollBetraege, habenKonten, habenBetraege);
    }
}


function fetchLiveTKonto(sollKonten, sollBetraege, habenKonten, habenBetraege) {
    const aufgabeId = "{{ aufgabe.id }}";
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    const params = new URLSearchParams();
    params.append('aufgabe_id', aufgabeId);
    params.append('soll_konten', JSON.stringify(sollKonten));
    params.append('soll_betraege', JSON.stringify(sollBetraege));
    params.append('haben_konten', JSON.stringify(habenKonten));
    params.append('haben_betraege', JSON.stringify(habenBetraege));

    fetch(`/posts/tkonto_vorschau/?${params.toString()}`, {
        headers: {
            'X-CSRFToken': csrfToken
        }
    })
    .then(response => response.json())
    .then(data => {
        renderTKontoVorschau(data);
    })
    .catch(error => {
        console.error(gettext('Fehler beim Laden des T-Kontos:'), error);
    });
}


function renderTKontoVorschau(data) {
    const container = document.getElementById('tkonto-vorschau');
    container.innerHTML = '';

    for (const konto of data.konten) {
        let html = `<div><h3>${konto.name}</h3><table><thead><tr><th>${gettext('Soll')}</th><th>${gettext('Haben')}</th></tr></thead><tbody>`;

        const maxLen = Math.max(konto.soll.length, konto.haben.length);
        for (let i = 0; i < maxLen; i++) {
            html += '<tr>';
            html += `<td>${konto.soll[i] || ''}</td>`;
            html += `<td>${konto.haben[i] || ''}</td>`;
            html += '</tr>';
        }
        html += '</tbody></table></div>';
        container.innerHTML += html;
    }
}
function toggleInfoBox() {
