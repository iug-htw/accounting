{% extends 'master_layout.html' %}
{% load static %}
{% block css %}
   <link rel="stylesheet" href="{% static 'css/aufgabe_erstellen.css' %}">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/trix/1.3.1/trix.min.css">
{% endblock %}
{% block content %}
  <h1>Aufgaben per Excel importieren</h1>
  <div class="link-buttons">
    <a href="{% url 'posts:unternehmen_verwalten' %}" class="btn btn-secondary">Unternehmen/Fallstudien verwalten</a>
    <a href="{% url 'posts:aufgabenkategorie_verwalten' %}" class="btn btn-secondary">Fragentyp verwalten</a>
    <a href="{% url 'posts:konten_verwalten' %}" class="btn btn-secondary">Konten verwalten</a>
    <a href="{% url 'posts:aufgabe_erstellen' %}" class="btn btn-info">Einzelne Aufgaben erstellen</a>
    </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-group">
      <label for="aufgabeninfo_input"><strong>Zusatzinformation zur Aufgabe (optional):</strong></label>
      <input id="aufgabeninfo_input" type="hidden" name="aufgabeninfo" value="{{ form.aufgabeninfo.value|default_if_none:'' }}">
      <trix-editor input="aufgabeninfo_input"></trix-editor>
    </div>
    <label for="excel_datei">Excel-Datei (.xlsx) hochladen:</label>
    <input type="file" name="excel_datei" required><br><br>

    <button type="submit" class="btn btn-primary">Import starten</button>
  </form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/trix/1.3.1/trix.min.js"></script>
{% endblock %}
