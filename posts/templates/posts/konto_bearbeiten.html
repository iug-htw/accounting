{% extends "master_layout.html" %}
{% block content %}
<h2>Konto bearbeiten</h2>

<form method="post">
    {% csrf_token %}
    <label for="id_name">Kontoname:</label>
    {{ form.name }}

    <label for="id_kategorie">Kategorie:</label>
    {{ form.kategorie }}

    <label for="id_unterkategorie">Unterkategorie:</label>
    {{ form.unterkategorie }}
    <label for="id_kontonumemr">Kontonummer:</label>
    {{ form.kontonummer }}
    <label for="id_bilanzposition">Bilanzposition:</label>
    {{ form.bilanzposition_nummer }}
    <label for="id_kontenplan">Kontenplan:</label>
    {{ form.kontenplan }}
    <button type="submit">Änderungen speichern</button>
</form>

<a href="{% url 'posts:konten_verwalten' %}">Zurück zur Übersicht</a>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        let kategorieField = document.querySelector("#id_kategorie");
        let unterkategorieField = document.querySelector("#id_unterkategorie");
    
        function updateUnterkategorie() {
            let kategorie = kategorieField.value;
            unterkategorieField.innerHTML = "";  // Reset Auswahl
            
            if (kategorie === "Bestandskonto") {
                unterkategorieField.innerHTML = `
                    <option value="Aktiva">Aktiva</option>
                    <option value="Passiva">Passiva</option>
                `;
            } else if (kategorie === "Erfolgskonto") {
                unterkategorieField.innerHTML = `
                    <option value="Aufwand">Aufwand</option>
                    <option value="Ertrag">Ertrag</option>
                `;
            }
        }
    
        kategorieField.addEventListener("change", updateUnterkategorie);
    });
    </script>
    
{% endblock %}
