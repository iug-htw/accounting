<!-- buchungsaufgabe.html -->
{% extends 'vorlage.html' %}
{% load static %}
{% block title %}
Buchungsaufgabe - Website Prototyp
{% endblock %}
{% block content %}
<div class="buchung_container">
    <!-- Linke Seite mit dem Bild -->
    <div class="buchung_links">
        <img src="/media/beispielrechnung.jpg" alt="Beispielrechnung" class="buchung_rechnungsbeleg">
    </div>

    <!-- Rechte Seite mit den Inputfeldern -->
    <div class="buchung_rechts">
        <h2>Berechnung</h2>
        <form id="numberForm">
            <!-- Initial number fields -->
            <div id="inputFields">
                <input type="number" name="number" placeholder="Zahl eingeben" required>
                <input type="number" name="number" placeholder="Zahl eingeben" required>
            </div>
            <br>
            <!-- Button to calculate sum -->
            <button type="button" onclick="calculateSum()">Summe berechnen</button>
            <br><br>
            <!-- Button to add more fields -->
            <button type="button" onclick="addField()">Neues Feld hinzufügen</button>
            <br><br>
            <!-- Button to remove the last field -->
            <button type="button" onclick="removeField()">Letztes Feld entfernen</button>
            <br><br>
            <!-- Result display -->
            <div id="result"></div>
        </form>
    </div>
</div>

<script>
    // Function to calculate the sum of all input fields
    function calculateSum() {
        let inputs = document.querySelectorAll('#inputFields input[type="number"]');
        let sum = 0;
        inputs.forEach(input => {
            let value = parseFloat(input.value);
            if (!isNaN(value)) {
                sum += value;
            }
        });
        document.getElementById('result').innerText = 'Summe: ' + sum;
    }

    // Function to add a new input field
    function addField() {
        let inputFieldsDiv = document.getElementById('inputFields');
        let newField = document.createElement('input');
        newField.type = 'number';
        newField.name = 'number';
        newField.placeholder = 'Zahl eingeben';
        inputFieldsDiv.appendChild(newField);
        inputFieldsDiv.appendChild(document.createElement('br'));
    }

    // Function to remove the last input field
    function removeField() {
        let inputFieldsDiv = document.getElementById('inputFields');
        let inputs = inputFieldsDiv.querySelectorAll('input[type="number"]');
        if (inputs.length > 2) { // Ensure at least two fields remain
            inputFieldsDiv.removeChild(inputs[inputs.length - 1].nextSibling); // Remove <br>
            inputFieldsDiv.removeChild(inputs[inputs.length - 1]); // Remove last input
        }
    }
</script>
{% endblock %}
