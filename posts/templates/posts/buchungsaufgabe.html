<!-- buchungsaufgabe.html -->
{% extends 'vorlage.html' %}
{% load static %}
{% block title %}
Buchungsaufgabe - Website Prototyp
{% endblock %}
{% block content %}
<div class="buchung_container">
    <!-- Linke Seite mit dem Bild -->
    <div class="buchung_links">
        <img src="/media/beispielrechnung.jpg" alt="Beispielrechnung" class="buchung_rechnungsbeleg">
    </div>

    <!-- Rechte Seite mit den Inputfeldern -->
    <div class="buchung_rechts">
        <h2>Deine Buchung</h2>
        <form method="POST">
            {% csrf_token %}
            <div id="sollDiv">
                <h3>Soll</h3>
                <input type="text" name="soll_konten[]" placeholder="Soll Konto" required>
                <input type="number" name="soll_betraege[]" placeholder="Betrag" required><br>
            </div>
            <button type="button" onclick="addSollFeld()">Weiteres Soll Konto hinzufügen</button><br><br>

            <div id="habenDiv">
                <h3>Haben</h3>
                <input type="text" name="haben_konten[]" placeholder="Haben Konto" required>
                <input type="number" name="haben_betraege[]" placeholder="Betrag" required><br>
            </div>
            <button type="button" onclick="addHabenFeld()">Weiteres Haben Konto hinzufügen</button><br><br>

            <button type="submit">Buchung abschicken</button>
        </form>
        
    </div>
</div>

<script>
    function addSollFeld() {
        var sollDiv = document.getElementById("sollDiv");
        sollDiv.innerHTML += '<input type="text" name="soll_konten[]" placeholder="Soll Konto" required>' +
                             '<input type="number" name="soll_betraege[]" placeholder="Betrag" required><br>';
    }

    function addHabenFeld() {
        var habenDiv = document.getElementById("habenDiv");
        habenDiv.innerHTML += '<input type="text" name="haben_konten[]" placeholder="Haben Konto" required>' +
                              '<input type="number" name="haben_betraege[]" placeholder="Betrag" required><br>';
    }
</script>
{% endblock %}
