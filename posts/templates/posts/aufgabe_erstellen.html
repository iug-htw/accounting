{% extends 'master_layout.html' %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
{% endblock %}
{% block content %}
    <h1>Neue Aufgabe erstellen</h1>
    <a href="{% url 'posts:unternehmen_verwalten' %}" class="btn btn-secondary">Unternehmen verwalten</a>
    <a href="{% url 'posts:aufgabenkategorie_verwalten' %}" class="btn btn-secondary">Fragentyp verwalten</a>
    <a href="{% url 'posts:konten_verwalten' %}" class="btn btn-secondary">Konten verwalten</a>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <h2>Felder hinzufügen</h2>
        <div id="fields-container_aufgabe_erstellen">
            <div class="field-group_aufgabe_erstellen">
                <select name="kontoname[]" required>
                    {% for konto in konten %}
                        <option value="{{ konto.name }}">{{ konto.name }}</option>
                    {% endfor %}
                </select>
                <select name="soll_haben[]" required>
                    <option value="Soll">Soll</option>
                    <option value="Haben">Haben</option>
                </select>
                <input type="number" placeholder="Betrag" name="betrag[]" required>
                <select name="monatsangabe[]" required>
                    <option value="true">Ja</option>
                    <option value="false">Nein</option>
                </select>
                <input type="number" placeholder="Monat" name="monat[]" min="1" max="12">
            </div>
        </div>


        <button type="button" onclick="addFieldGroup()">Weitere Felder hinzufügen</button>
        <br><br>
        <button type="submit">Speichern</button>
    </form>

    <script>
        // Funktion zum Hinzufügen neuer Felder
        function addFieldGroup() {
            let container = document.getElementById('fields-container_aufgabe_erstellen');
            let newFieldGroup = document.createElement('div');
            newFieldGroup.classList.add('field-group_aufgabe_erstellen');
        
            let kontenOptions = `
                {% for konto in konten %}
                    <option value="{{ konto.name }}">{{ konto.name }}</option>
                {% endfor %}
            `;
        
            newFieldGroup.innerHTML = `
                <select name="kontoname[]" required>${kontenOptions}</select>
                <select name="soll_haben[]" required>
                    <option value="Soll">Soll</option>
                    <option value="Haben">Haben</option>
                </select>
                <input type="number" placeholder="Betrag" name="betrag[]" required>
                <select name="monatsangabe[]" required>
                    <option value="true">Ja</option>
                    <option value="false">Nein</option>
                </select>
                <input type="number" placeholder="Monat" name="monat[]" min="1" max="12">
                <br>
            `;
        
            container.appendChild(newFieldGroup);
        }
    </script>
{% endblock %}
