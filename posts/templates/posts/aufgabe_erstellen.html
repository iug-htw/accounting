<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aufgabe erstellen</title>
    <script>
        // Funktion zum Hinzufügen neuer Felder
        function addFieldGroup() {
            let container = document.getElementById('fields-container');
            let newFieldGroup = document.createElement('div');
            newFieldGroup.classList.add('field-group');

            newFieldGroup.innerHTML = `
                <input type="text" placeholder="Kontoname" name="kontoname[]" required>
                <select name="soll_haben[]" required>
                    <option value="Soll">Soll</option>
                    <option value="Haben">Haben</option>
                </select>
                <input type="number" placeholder="Betrag" name="betrag[]" required>
                <select name="monatsangabe[]" required>
                    <option value="true">Ja</option>
                    <option value="false">Nein</option>
                </select>
                <input type="number" placeholder="Monat" name="monat[]" min="1" max="12">
                <br>
            `;

            container.appendChild(newFieldGroup);
        }
    </script>
    <style>
        .field-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .field-group input, .field-group select {
            flex: 1;
        }
    </style>
</head>
<body>
    <a href={% url 'frontpage2' %} class="navigation-item">Aufgabe erstellen</a>
    <h1>Neue Aufgabe erstellen</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <h2>Felder hinzufügen</h2>
        <div id="fields-container">
            <div class="field-group">
                <input type="text" placeholder="Kontoname" name="kontoname[]" required>
                <select name="soll_haben[]" required>
                    <option value="Soll">Soll</option>
                    <option value="Haben">Haben</option>
                </select>
                <input type="number" placeholder="Betrag" name="betrag[]" required>
                <select name="monatsangabe[]" required>
                    <option value="true">Ja</option>
                    <option value="false">Nein</option>
                </select>
                <input type="number" placeholder="Monat" name="monat[]" min="1" max="12">
            </div>
        </div>

        <button type="button" onclick="addFieldGroup()">Weitere Felder hinzufügen</button>
        <br><br>
        <button type="submit">Speichern</button>
    </form>
</body>
</html>
