<!-- kategorien_liste.html -->
{% extends 'vorlage.html' %}
{% load static %}
{% block title %}
Kategorien - Website Prototyp
{% endblock %}
{% block content %}
    <h2>Kategorien</h2>
    <ul>
        {% for kategorie in kategorien %}
            <li><a href="{% url 'posts:kategorie_aufgaben' kategorie.id %}">{{ kategorie.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
