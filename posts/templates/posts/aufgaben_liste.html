<!-- aufgaben_liste.html -->
{% extends 'vorlage.html' %}
{% block title %}
Aufgaben nach Kategorien
{% endblock %}
{% block content %}
    <h2>Aufgaben in der Kategorie</h2>
    <ul>
        {% for aufgabe in aufgaben %}
            <li><a href="{% url 'posts:aufgabe_detail' aufgabe.id %}?kategorie={{ kategorie.id }}">{{ aufgabe.kategorie }} - Aufgabe {{ aufgabe.id }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
